<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIZ Engineering - Industrial & Municipal WWTP Studio</title>
    <style>
        body { 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif; 
            margin: 0; background-color: #0f172a; color: #f8fafc;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }
        .header { 
            background: linear-gradient(135deg, #020617 0%, #1e3a8a 100%); 
            color: white; padding: 12px 20px; display: flex;
            justify-content: space-between; align-items: center;
            flex-shrink: 0; border-bottom: 2px solid #3b82f6;
        }
        .header-title h1 { margin: 0; font-size: 18px; font-weight: 800; }
        .header-title p { margin: 2px 0 0 0; opacity: 0.8; font-size: 11px; text-transform: uppercase; color: #38bdf8; }
        
        .app-container { 
            display: flex; padding: 10px; box-sizing: border-box; flex: 1;
            height: calc(100vh - 65px); overflow: hidden; gap: 10px;
        }
        .panel { 
            background: #1e293b; border-radius: 8px; display: flex; 
            flex-direction: column; height: 100%; box-sizing: border-box;
            border: 1px solid #334155;
        }
        
        .sidebar-tabs { flex: 1.1; min-width: 320px; max-width: 360px; }
        .canvas-pfd { flex: 1.2; background-color: #0f172a; border: 1px solid #334155; overflow-y: auto; padding: 12px; }
        .analytics-ledger { flex: 1.5; overflow-y: auto; padding: 14px; background-color: #020617; }

        .tab-strip { display: flex; background: #334155; padding: 4px 4px 0 4px; border-top-left-radius: 6px; border-top-right-radius: 6px; }
        .tab-btn { flex: 1; padding: 8px 2px; font-size: 11px; font-weight: 700; border: none; background: transparent; color: #94a3b8; cursor: pointer; text-transform: uppercase; }
        .tab-btn.active { color: #38bdf8; background: #1e293b; border-top-left-radius: 4px; border-top-right-radius: 4px; }
        .tab-content { padding: 12px; overflow-y: auto; flex: 1; }

        h3 { margin-top: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #334155; padding-bottom: 4px; color: #38bdf8; }
        h4 { margin: 14px 0 4px 0; font-size: 11px; text-transform: uppercase; color: #94a3b8; border-bottom: 1px dashed #334155; padding-bottom: 2px; }

        .form-group { margin-bottom: 8px; display: flex; flex-direction: column; gap: 2px; }
        label { font-weight: 700; font-size: 11px; color: #94a3b8; }
        input, select { padding: 6px 10px; border: 1px solid #475569; border-radius: 6px; font-size: 12px; background: #0f172a; color: #f8fafc; width: 100%; box-sizing: border-box; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .checkbox-group { display: flex; align-items: center; gap: 6px; background: #0f172a; padding: 6px; border-radius: 4px; border: 1px solid #334155; margin-bottom: 4px; font-size: 11px; }
        .checkbox-group input { width: auto; margin: 0; }

        .btn-primary { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; border: none; padding: 12px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; width: 100%; margin-top: auto; }
        .btn-primary:hover { background: #1e40af; }

        /* PFD Flow Blocks */
        .pfd-chain { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 2px; }
        .pfd-node { width: 100%; background: #1e293b; border: 1px solid #334155; border-left: 5px solid #64748b; border-radius: 6px; padding: 8px; box-sizing: border-box; }
        .pfd-node.pretreatment { border-left-color: #3b82f6; }
        .pfd-node.biological { border-left-color: #f97316; }
        .pfd-node.membrane { border-left-color: #06b6d4; }
        .node-hdr { font-weight: 800; font-size: 12px; color: #38bdf8; }
        .node-desc { font-size: 11px; color: #94a3b8; margin: 2px 0; }
        .node-meta { font-size: 10px; font-weight: 700; color: #f8fafc; background: #0f172a; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 2px; }
        .pfd-arrow { font-size: 11px; color: #475569; margin: 2px 0; }

        .banner { padding: 8px 12px; border-radius: 6px; font-size: 11px; margin-bottom: 10px; border-left: 4px solid #e11d48; background: #881337; color: #fecdd3; }
        .text-hl { color: #34d399; font-weight: 700; }
        ul { padding-left: 12px; margin: 2px 0; }
        li { font-size: 11px; margin-bottom: 3px; color: #cbd5e1; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">
            <h1>SHIZ Pro Parametric Process Studio</h1>
            <p>Metcalf &amp; Eddy 5th Edition Rigorous Wastewater Mass-Balance Suite</p>
        </div>
    </div>

    <div class="app-container">
        <div class="panel sidebar-tabs">
            <div class="tab-strip">
                <button class="tab-btn active">Inputs &amp; Targets</button>
            </div>
            <div class="tab-content">
                <h3>1. Influent Properties</h3>
                <div class="form-group">
                    <label for="flowInput">Volumetric Flow Rate (m³/day)</label>
                    <input type="number" id="flowInput" value="40">
                </div>
                <div class="grid-2">
                    <div class="form-group"><label>BOD₅ (mg/L)</label><input type="number" id="bodInput" value="120"></div>
                    <div class="form-group"><label>Total COD (mg/L)</label><input type="number" id="codInput" value="700"></div>
                    <div class="form-group"><label>TSS (mg/L)</label><input type="number" id="tssInput" value="71"></div>
                    <div class="form-group"><label>TDS (mg/L)</label><input type="number" id="tdsInput" value="2270"></div>
                    <div class="form-group"><label>TN (mg/L)</label><input type="number" id="tnInput" value="80"></div>
                    <div class="form-group"><label>TP (mg/L)</label><input type="number" id="tpInput" value="15"></div>
                </div>

                <h3>2. Compliance Targets</h3>
                <div class="grid-2">
                    <div class="form-group"><label>Target BOD</label><input type="number" id="tBod" value="10"></div>
                    <div class="form-group"><label>Target COD</label><input type="number" id="tCod" value="20"></div>
                </div>

                <h3>3. Unit Configurations</h3>
                <div class="checkbox-group"><input type="checkbox" id="useCoag" checked><label>FeCl₃ Coagulation-Flocculation</label></div>
                <div class="checkbox-group"><input type="checkbox" id="useAnaerobic" checked><label>Anaerobic CSTR Stage</label></div>
                <div class="checkbox-group"><input type="checkbox" id="useRO" checked><label>Force Reverse Osmosis Desalination</label></div>
            </div>
            <button class="btn-primary" onclick="runRigorousM&EEngine()">⚡ Compute Mass Balance Ledger</button>
        </div>

        <div class="panel canvas-pfd">
            <h3>Automated Configuration Flowsheet</h3>
            <div id="pfdTarget" class="pfd-chain"></div>
        </div>

        <div class="panel analytics-ledger">
            <h3>Calculated Design &amp; Cost Ledger</h3>
            <div id="warningTarget"></div>
            <div id="ledgerTarget"></div>
        </div>
    </div>

    <script>
        function runRigorousM&EEngine() {
            // Read UI inputs
            let q = parseFloat(document.getElementById('flowInput').value);
            let bod = parseFloat(document.getElementById('bodInput').value);
            let cod = parseFloat(document.getElementById('codInput').value);
            let tss = parseFloat(document.getElementById('tssInput').value);
            let tds = parseFloat(document.getElementById('tdsInput').value);
            let tn = parseFloat(document.getElementById('tnInput').value);
            let tp = parseFloat(document.getElementById('tpInput').value);
            let t_bod = parseFloat(document.getElementById('tBod').value);
            let t_cod = parseFloat(document.getElementById('tCod').value);

            // 1. Metcalf & Eddy Fractionation Split
            let bCOD = bod * 1.42; 
            let nonBioCOD = Math.max(0, cod - bCOD);

            let drySludgeChemicalKg = 0;
            let drySludgeBiologicalKg = 0;
            let methaneProductionM3 = 0;

            let steps = [];

            // 2. Chemical Pretreatment Stage
            if (document.getElementById('useCoag').checked) {
                let tssRemoved = tss * 0.60; 
                let tpRemoved = tp * 0.85;
                // Coagulation Sludge formula: Removed solids + Chemical precipitant precipitate additions
                drySludgeChemicalKg = (q * tssRemoved * 0.001) + (q * tpRemoved * 0.001 * 2.5);
                tss -= tssRemoved;
                tp -= tpRemoved;
                steps.push({ title: "FeCl₃ Coagulation Skid", desc: "Removes colloids and heavy bound phosphate chains.", metric: `Sludge generated: ${drySludgeChemicalKg.toFixed(1)} kg DS/d`, type: "pretreatment" });
            }

            // 3. Anaerobic Core Bioreactor Stage
            if (document.getElementById('useAnaerobic').checked) {
                let bioCodDestroyed = bCOD * 0.75;
                bCOD -= bioCodDestroyed;
                // M&E Standard Mesophilic Yield constant: 0.25 m³ methane per kg of digestible COD destroyed
                methaneProductionM3 = (q * bioCodDestroyed * 0.001) * 0.25;
                // Anaerobic Yield synthesis fraction (approx 0.06 g VSS / g COD)
                drySludgeBiologicalKg += (q * bioCodDestroyed * 0.001) * 0.06;
                bod = bCOD / 1.42;
                steps.push({ title: "Anaerobic CSTR Bioreactor", desc: "Decomposes digestible organic structures into bio-gas.", metric: `CH₄ Generated: ${methaneProductionM3.toFixed(1)} m³/d`, type: "biological" });
            }

            // 4. Aerobic Polishing Stage (MLE Loop for Nitrogen targets)
            if (tn > 15) {
                let bioCodPolished = bCOD * 0.85;
                bCOD -= bioCodPolished;
                // Aerobic Heterotrophic Yield matrix coefficient (0.4 g VSS per g COD removed)
                drySludgeBiologicalKg += (q * bioCodPolished * 0.001) * 0.40;
                bod = bCOD / 1.42;
                let tnRemoved = tn - 12;
                tn = 12; // Denitrification design boundary
                steps.push({ title: "Aerobic CAS & MLE Loop", desc: "Forces biological nitrification/denitrification transformations.", metric: `Biomass Yield: ${drySludgeBiologicalKg.toFixed(1)} kg/d`, type: "biological" });
            }

            // Total remaining unseparated bulk organic concentrations
            let bulkCodEffluent = Math.round(bCOD + nonBioCOD);

            // 5. Dual-Stream High Barrier Membrane Split (RO Module)
            let permeateFlow = q;
            let concentrateFlow = 0;
            let permeateTds = tds;
            let concentrateTds = tds;
            let permeateCod = bulkCodEffluent;
            let concentrateCod = bulkCodEffluent;

            if (document.getElementById('useRO').checked || bulkCodEffluent > t_cod) {
                permeateFlow = q * 0.75;
                concentrateFlow = q * 0.25;
                
                // RO Log Rejection Ratios
                permeateTds = Math.round(tds * 0.008); // 99.2% salt rejection
                concentrateTds = Math.round(tds * 3.97); // Volumetric accumulation matching
                
                permeateCod = Math.round(bulkCodEffluent * 0.01); // 99% macromolecular barrier capture
                concentrateCod = Math.round(bulkCodEffluent * 3.96);
                
                bod = 0.1;
                steps.push({ title: "Reverse Osmosis Skid", desc: "Splits bulk matrix into pure water reuse and concentrate brine streams.", metric: `Permeate Q: ${permeateFlow.toFixed(1)} m³/d | Brine Q: ${concentrateFlow.toFixed(1)} m³/d`, type: "membrane" });
            }

            // Total Combined Sludge Metrics
            let totalDrySludgeMass = drySludgeChemicalKg + drySludgeBiologicalKg;
            let wetCakeVolumeM3 = (totalDrySludgeMass / 0.20) / 1000; // Sized based on 20% dry solids press capacity

            // Render Flows Rendering
            let pfd = document.getElementById('pfdTarget'); pfd.innerHTML = '';
            steps.forEach((s, idx) => {
                pfd.innerHTML += `<div class="pfd-node ${s.type}"><div class="node-hdr">${idx+1}. ${s.title}</div><div class="node-desc">${s.desc}</div><div class="node-meta">${s.metric}</div></div>`;
                if(idx < steps.length - 1) pfd.innerHTML += `<div class="pfd-arrow">▼</div>`;
            });

            // Handle Warnings Validation
            let warn = document.getElementById('warningTarget');
            if (permeateCod <= t_cod) {
                warn.innerHTML = `<div class="banner" style="background:#064e3b; color:#a7f3d0; border-color:#059669;">✓ Mass Balance Achieved: Sized RO Permeate stream meets target requirements safely.</div>`;
            } else {
                warn.innerHTML = `<div class="banner">⚠️ Compliance Violation: Permeate output COD (${permeateCod} mg/L) exceeds design threshold limits.</div>`;
            }

            // Scale realistic industrial OPEX curves based on pumping energy and sludge handling
            let realOpexPerM3 = 0.50 + ((totalDrySludgeMass * 0.45) / q) + (document.getElementById('useRO').checked ? 1.20 : 0);
            let estimatedCapex = 120000 * Math.pow(q, 0.65) * (document.getElementById('useRO').checked ? 1.4 : 1.0);

            // Print Output Data Lists
            document.getElementById('ledgerTarget').innerHTML = `
                <h4>1. Influent Parameter Ratios</h4>
                <ul>
                    <li>Computed COD/BOD Ratio: <span class="text-hl">${(cod/bod).toFixed(2)}</span></li>
                    <li>Biodegradable Mass Fraction (bCOD): <span class="text-hl">${bCOD.toFixed(1)} mg/L</span></li>
                    <li>Refractory Chemically Inert COD: <span class="text-hl">${nonBioCOD.toFixed(1)} mg/L</span> (Bypasses Bioreactors)</li>
                </ul>
                <h4>2. High Barrier RO Permeate Quality</h4>
                <ul>
                    <li>Permeate Volumetric Output: <span class="text-hl">${permeateFlow.toFixed(1)} m³/day</span></li>
                    <li>Product Water Residual COD: <span class="text-hl">${permeateCod} mg/L</span> (Target Limit: ${t_cod} mg/L)</li>
                    <li>Product Water Total TDS: <span class="text-hl">${permeateTds} mg/L</span></li>
                </ul>
                <h4>3. Concentrated RO Brine Stream Properties</h4>
                <ul>
                    <li>Brine Volumetric Flow: <span class="text-hl">${concentrateFlow.toFixed(1)} m³/day</span></li>
                    <li>Brine Concentrated COD Load: <span class="text-hl">${concentrateCod} mg/L</span></li>
                    <li>Brine Concentrated TDS Load: <span class="text-hl">${concentrateTds} mg/L</span></li>
                </ul>
                <h4>4. Rigorous Conservation Mass Sludge Balance</h4>
                <ul>
                    <li>Chemical Precipitant Sludge Mass: <span class="text-hl">${drySludgeChemicalKg.toFixed(1)} kg dry mass/day</span></li>
                    <li>Biological Net Yield Mass Accumulation: <span class="text-hl">${drySludgeBiologicalKg.toFixed(1)} kg dry mass/day</span></li>
                    <li>Total Consolidated Compressed Wet Cake: <span class="text-hl">${wetCakeVolumeM3.toFixed(3)} m³/day</span> at 20% DS</li>
                    <li>Calculated Biogas Methane Influx: <span class="text-hl">${methaneProductionM3.toFixed(1)} m³/day</span></li>
                </ul>
                <h4>5. Real Industrial Financial Estimates</h4>
                <ul>
                    <li>Estimated Asset Sizing CAPEX: <span class="text-hl">€${Math.round(estimatedCapex).toLocaleString()} EUR</span></li>
                    <li>Calibrated Volumetric OPEX Layer: <span class="text-hl">€${realOpexPerM3.toFixed(2)} EUR/m³</span></li>
                </ul>
            `;
        }
    </script>
</body>
</html>
